name: CI - Test

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:
  # ============================================
  # Build native libraries (reusable workflow)
  # ============================================
  build-natives:
    uses: ./.github/workflows/build-natives.yml

  # ============================================
  # Run tests on each platform
  # ============================================
  test:
    needs: build-natives
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-13
            platform: mac-x64
          - os: macos-14
            platform: mac-arm64
          - os: ubuntu-22.04
            platform: linux

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        cache: 'maven'

    - name: Download all native libraries
      uses: actions/download-artifact@v4
      with:
        pattern: webp4j-*
        merge-multiple: true
        path: src/main/resources/native

    - name: Display downloaded libraries
      run: ls -lh src/main/resources/native/
      shell: bash

    - name: Run tests
      run: mvn -B test

    - name: Verify JAR contents
      if: always()
      run: |
        echo "Checking if native libraries are included in JAR..."
        jar tf target/webp4j-*.jar | grep "native/" || echo "No native libraries found in JAR"
      shell: bash

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.platform }}
        path: target/surefire-reports/
        retention-days: 7