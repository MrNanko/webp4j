name: CI

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      rebuild_natives:
        description: 'Rebuild native libraries'
        required: false
        type: boolean
        default: true

env:
  JAVA_VERSION: '21'

jobs:
  # ============================================
  # Build native libraries (reusable workflow)
  # ============================================
  build-natives:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.rebuild_natives)
    uses: ./.github/workflows/build-natives.yml

  # ============================================
  # Run tests on each platform
  # ============================================
  test:
    needs: build-natives
    if: always() && !cancelled()
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-15-intel
            platform: mac-x64
          - os: macos-latest
            platform: mac-arm64
          - os: ubuntu-22.04
            platform: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Download all native libraries (from current run)
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.rebuild_natives)
        uses: actions/download-artifact@v4
        with:
          name: webp4j-all-platforms
          path: src/main/resources/native

      - name: Download all native libraries (from latest successful run)
        if: github.event_name == 'workflow_dispatch' && !inputs.rebuild_natives
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-natives.yml
          name: webp4j-all-platforms
          path: src/main/resources/native
          search_artifacts: true

      - name: Display downloaded libraries
        run: ls -lh src/main/resources/native/
        shell: bash

      - name: Run tests
        run: mvn -B test

      - name: Verify JAR contents
        if: always()
        run: |
          echo "Checking if native libraries are included in JAR..."
          jar tf target/webp4j-*.jar | grep "native/" || echo "No native libraries found in JAR"
        shell: bash

      - name: Upload test results and output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}
          path: |
            target/surefire-reports/
            target/test-output/
          retention-days: 7
