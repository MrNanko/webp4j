name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '21'

jobs:
  # ============================================
  # Build native libraries (reusable workflow)
  # ============================================
  build-natives:
    name: Build Native Libraries
    uses: ./.github/workflows/build-natives.yml

  # ============================================
  # Publish to Maven Central
  # ============================================
  publish-maven:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: build-natives

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java for Maven Central
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        cache: 'maven'
        server-id: 'ossrh'
        server-username: OSSRH_USERNAME
        server-password: OSSRH_PASSWORD
        gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
        gpg-passphrase: GPG_PASSPHRASE

    - name: Download all native artifacts
      uses: actions/download-artifact@v4
      with:
        name: webp4j-all-platforms
        path: src/main/resources/native

    - name: Display native libraries
      run: |
        echo "Native files:" && ls -lh src/main/resources/native || true

    - name: Build and package JAR
      run: |
        mvn -B clean package -DskipTests
        echo "JAR contents:" && jar tf target/webp4j-*.jar | grep native/ || true

    - name: Publish to Maven Central
      env:
        OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        mvn -B deploy -DskipTests

  # ============================================
  # Create GitHub Release
  # ============================================
  create-release:
    name: Create GitHub Release
    needs: publish-maven
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')  # Only when tag is pushed

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract version without 'v' prefix
      id: version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        cache: 'maven'

    - name: Download all native artifacts
      uses: actions/download-artifact@v4
      with:
        name: webp4j-all-platforms
        path: src/main/resources/native

    - name: Display native libraries
      run: |
        echo "Native files:" && ls -lh src/main/resources/native || true

    - name: Build JAR with all native libraries
      run: |
        mvn -B clean package -DskipTests
        echo "JAR contents:" && jar tf target/webp4j-*.jar | grep native/ || true

    - name: Prepare release files
      run: |
        mkdir -p release-files
        cp target/webp4j-*.jar release-files/ 2>/dev/null || true
        cd release-files
        sha256sum *.jar > SHA256SUMS 2>/dev/null || true
        cat SHA256SUMS

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release-files/*
        generate_release_notes: true
        draft: false
        prerelease: false
        body: |
          ## WebP4j Release

          ### What's Changed
          - **Security fix** - Fixed heap buffer overflow vulnerability in GIF decoder caused by integer overflow (Issue #6).
          - **Dropped ARM32 support** - Removed Linux ARM32 (armv7) platform support.

          ### Installation

          **Maven:**
          ```xml
          <dependency>
            <groupId>dev.matrixlab.webp4j</groupId>
            <artifactId>webp4j-core</artifactId>
            <version>${{ steps.version.outputs.VERSION }}</version>
          </dependency>
          ```

          **Gradle:**
          ```gradle
          implementation 'dev.matrixlab.webp4j:webp4j-core:${{ steps.version.outputs.VERSION }}'
          ```

          ### Supported Platforms
          - Windows x64
          - Windows ARM64 (aarch64)
          - macOS x64 (Intel)
          - macOS arm64 (Apple Silicon)
          - Linux x64
          - Linux ARM64 (aarch64)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}