name: Release - Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '17'

jobs:
  # ============================================
  # Build native libraries (reusable workflow)
  # ============================================
  build-natives:
    name: Build Native Libraries
    uses: ./.github/workflows/build-natives.yml

  # ============================================
  # Collect libraries from all platforms
  # ============================================
  collect-artifacts:
    name: Collect Artifacts
    needs: build-natives
    runs-on: ubuntu-latest

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: webp4j-*
        path: native-libraries

    - name: Display structure of downloaded files
      run: ls -R native-libraries

    - name: Organize files
      run: |
        mkdir -p collected
        find native-libraries -type f \( -name "*.dll" -o -name "*.so" -o -name "*.dylib" \) -exec cp {} collected/ \;
        ls -lh collected/

    - name: Upload collected libraries
      uses: actions/upload-artifact@v4
      with:
        name: webp4j-all-platforms
        path: collected/
        retention-days: 30

    - name: Create checksum
      run: |
        cd collected
        sha256sum * > SHA256SUMS
        cat SHA256SUMS

    - name: Upload checksum
      uses: actions/upload-artifact@v4
      with:
        name: webp4j-checksums
        path: collected/SHA256SUMS
        retention-days: 30

  # ============================================
  # Publish to Maven Central
  # ============================================
  publish-maven:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: build-natives

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java for Maven Central
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        cache: 'maven'
        server-id: 'ossrh'
        server-username: OSSRH_USERNAME
        server-password: OSSRH_PASSWORD
        gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
        gpg-passphrase: GPG_PASSPHRASE

    - name: Download all native artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: webp4j-*
        merge-multiple: true
        path: downloads

    - name: Prepare native resources directory
      run: |
        mkdir -p src/main/resources/native
        shopt -s nullglob
        mv downloads/*.so src/main/resources/native/ 2>/dev/null || true
        mv downloads/*.dylib src/main/resources/native/ 2>/dev/null || true
        mv downloads/*.dll src/main/resources/native/ 2>/dev/null || true
        echo "Native files:" && ls -lh src/main/resources/native || true

    - name: Build and package JAR
      run: |
        mvn -B clean package -DskipTests
        echo "JAR contents:" && jar tf target/webp4j-*.jar | grep native/ || true

    - name: Publish to Maven Central
      env:
        OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        mvn -B deploy -DskipTests

  # ============================================
  # Create GitHub Release (only when tag is pushed)
  # ============================================
  create-release:
    name: Create GitHub Release
    needs: publish-maven
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract version without 'v' prefix
      id: version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        cache: 'maven'

    - name: Download all native artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: webp4j-*
        merge-multiple: true
        path: downloads

    - name: Prepare native resources directory
      run: |
        mkdir -p src/main/resources/native
        shopt -s nullglob
        mv downloads/*.so src/main/resources/native/ 2>/dev/null || true
        mv downloads/*.dylib src/main/resources/native/ 2>/dev/null || true
        mv downloads/*.dll src/main/resources/native/ 2>/dev/null || true
        echo "Native files:" && ls -lh src/main/resources/native || true

    - name: Build JAR with all native libraries
      run: |
        mvn -B clean package -DskipTests
        echo "JAR contents:" && jar tf target/webp4j-*.jar | grep native/ || true

    - name: Prepare release files
      run: |
        mkdir -p release-files
        cp target/webp4j-*.jar release-files/ 2>/dev/null || true
        cd release-files
        sha256sum *.jar > SHA256SUMS 2>/dev/null || true
        cat SHA256SUMS

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release-files/*
        generate_release_notes: true
        draft: false
        prerelease: false
        body: |
          ## WebP4j Release

          ### Installation

          **Maven:**
          ```xml
          <dependency>
            <groupId>dev.matrixlab</groupId>
            <artifactId>webp4j</artifactId>
            <version>${{ steps.version.outputs.VERSION }}</version>
          </dependency>
          ```

          **Gradle:**
          ```gradle
          implementation 'dev.matrixlab:webp4j:${{ steps.version.outputs.VERSION }}'
          ```

          ### Files Included
          - `webp4j-${{ steps.version.outputs.VERSION }}.jar` - Main JAR with all native libraries bundled
          - `SHA256SUMS` - Checksum file for verification

          ### Supported Platforms
          - Windows x64
          - macOS x64 (Intel)
          - macOS arm64 (Apple Silicon)
          - Linux x64
          - Linux aarch64 (ARM64)
          - Linux arm (ARM32)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}