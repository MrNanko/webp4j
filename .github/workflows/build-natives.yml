name: Build Native Libraries

on:
  workflow_call:
    outputs:
      artifact-name:
        description: "Name of the artifact containing all native libraries"
        value: webp4j-natives-${{ github.sha }}
  workflow_dispatch:

env:
  JAVA_VERSION: '21'

jobs:
  # ============================================
  # Windows Build
  # ============================================
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Setup MinGW
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-make

    - name: Build
      shell: msys2 {0}
      run: |
        mkdir build && cd build
        cmake -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release ..
        mingw32-make -j$(nproc)
        mingw32-make install

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: webp4j-windows-${{ matrix.arch }}
        path: src/main/resources/native/webp4j-windows-${{ matrix.arch }}.dll
        retention-days: 7

  # ============================================
  # macOS Build (matrix for x64 and arm64)
  # ============================================
  build-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-latest
            arch: arm64
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Install CMake
      run: brew install cmake

    - name: Build
      run: |
        mkdir build && cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        make -j$(sysctl -n hw.ncpu)
        make install

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: webp4j-mac-${{ matrix.arch }}
        path: src/main/resources/native/libwebp4j-mac-${{ matrix.arch }}.dylib
        retention-days: 7

  # ============================================
  # Linux Build (x64 native)
  # ============================================
  build-linux-x64:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Build
      run: |
        mkdir build && cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)
        make install

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: webp4j-linux-x64
        path: src/main/resources/native/libwebp4j-linux-x64.so
        retention-days: 7

  # ============================================
  # Linux ARM64 Build - Native (Priority: Self-hosted)
  # ============================================
  build-linux-arm64-native:
    runs-on: self-hosted
    timeout-minutes: 15
    continue-on-error: true  # Allow fallback to QEMU if self-hosted not available
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Build (Native ARM64)
      run: |
        mkdir build && cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)
        make install

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: webp4j-linux-aarch64
        path: src/main/resources/native/libwebp4j-linux-aarch64.so
        retention-days: 7

  # ============================================
  # Linux ARM64 Build - QEMU (Fallback)
  # ============================================
  build-linux-arm64-qemu:
    runs-on: ubuntu-22.04
    needs: build-linux-arm64-native
    if: failure() || cancelled()  # Run only if native build fails or is cancelled
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Build on ARM64 (QEMU Emulation)
      uses: uraimo/run-on-arch-action@v2
      with:
        arch: aarch64
        distro: ubuntu22.04
        githubToken: ${{ github.token }}
        install: |
          apt-get update -q -y
          apt-get install -q -y build-essential cmake openjdk-21-jdk git
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-arm64
          export PATH="${JAVA_HOME}/bin:${PATH}"
          export WEBP4J_QEMU_BUILD=1
          git config --global --add safe.directory /home/runner/work/webp4j/webp4j
          git config --global --add safe.directory /home/runner/work/webp4j/webp4j/libwebp
          git submodule update --init --recursive
          rm -rf build
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j1
          make install

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: webp4j-linux-aarch64
        path: src/main/resources/native/libwebp4j-linux-aarch64.so
        retention-days: 7

  # ============================================
  # Linux ARM32 Build (QEMU emulation)
  # ============================================
  build-linux-arm32:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm

    - name: Build on ARM32
      uses: uraimo/run-on-arch-action@v2
      with:
        arch: armv7
        distro: ubuntu22.04
        githubToken: ${{ github.token }}
        install: |
          apt-get update -q -y
          apt-get install -q -y build-essential cmake openjdk-21-jdk git
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-armhf
          export PATH="${JAVA_HOME}/bin:${PATH}"
          export WEBP4J_QEMU_BUILD=1
          git config --global --add safe.directory /home/runner/work/webp4j/webp4j
          git config --global --add safe.directory /home/runner/work/webp4j/webp4j/libwebp
          git submodule update --init --recursive
          rm -rf build
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          make install

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: webp4j-linux-arm
        path: src/main/resources/native/libwebp4j-linux-arm.so
        retention-days: 7

  # ============================================
  # Collect all native libraries
  # ============================================
  collect-all-libraries:
    name: Collect All Native Libraries
    needs:
      - build-windows
      - build-macos
      - build-linux-x64
      - build-linux-arm64-native
      - build-linux-arm64-qemu
      - build-linux-arm32
    runs-on: ubuntu-latest
    if: always()  # Run even if some builds fail or are skipped

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: webp4j-*
        path: native-libraries

    - name: Display structure of downloaded files
      run: ls -R native-libraries

    - name: Organize files
      run: |
        mkdir -p collected
        find native-libraries -type f \( -name "*.dll" -o -name "*.so" -o -name "*.dylib" \) -exec cp {} collected/ \;
        ls -lh collected/

    - name: Upload collected libraries
      uses: actions/upload-artifact@v4
      with:
        name: webp4j-all-platforms
        path: collected/
        retention-days: 7

    - name: Create checksum
      run: |
        cd collected
        sha256sum * > SHA256SUMS
        cat SHA256SUMS

    - name: Upload checksum
      uses: actions/upload-artifact@v4
      with:
        name: webp4j-checksums
        path: collected/SHA256SUMS
        retention-days: 7