name: Build Native Libraries

on:
  workflow_call:
    outputs:
      artifact-name:
        description: "Name of the artifact containing all native libraries"
        value: webp4j-natives-${{ github.sha }}
  workflow_dispatch:

env:
  JAVA_VERSION: '21'

jobs:
  # ============================================
  # Windows Build (matrix for x64 and arm64)
  # ============================================
  build-windows:
    name: build-windows (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
            msystem: MINGW64
            packages: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-make
          - os: windows-11-arm
            arch: aarch64
            msystem: CLANGARM64
            packages: mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-cmake mingw-w64-clang-aarch64-make
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Setup MinGW
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        update: true
        install: ${{ matrix.packages }}

    - name: Build
      shell: msys2 {0}
      run: |
        mkdir build && cd build
        cmake -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release ..
        mingw32-make -j$(nproc)
        mingw32-make install

    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: webp4j-windows-${{ matrix.arch }}
        path: src/main/resources/native/webp4j-windows-${{ matrix.arch }}.dll
        retention-days: 7

  # ============================================
  # macOS Build (matrix for x64 and arm64)
  # ============================================
  build-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-latest
            arch: arm64
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Install CMake
      run: brew install cmake

    - name: Build
      run: |
        mkdir build && cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        make -j$(sysctl -n hw.ncpu)
        make install

    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: webp4j-mac-${{ matrix.arch }}
        path: src/main/resources/native/libwebp4j-mac-${{ matrix.arch }}.dylib
        retention-days: 7

  # ============================================
  # Linux Build (matrix for x64 and aarch64)
  # ============================================
  build-linux:
    name: build-linux (${{ matrix.runner }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
            artifact-path: src/main/resources/native/libwebp4j-linux-x64.so
          - runner: self-hosted
            arch: aarch64
            artifact-path: src/main/resources/native/libwebp4j-linux-aarch64.so
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Build
      run: |
        mkdir build && cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)
        make install

    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: webp4j-linux-${{ matrix.arch }}
        path: ${{ matrix.artifact-path }}
        retention-days: 7

  # ============================================
  # Collect all native libraries
  # ============================================
  collect-all-libraries:
    name: Collect All Native Libraries
    needs:
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-latest
    if: always()  # Run even if some builds fail or are skipped

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v5
      with:
        pattern: webp4j-*
        path: native-libraries

    - name: Display structure of downloaded files
      run: ls -R native-libraries

    - name: Organize files
      run: |
        mkdir -p collected
        find native-libraries -type f \( -name "*.dll" -o -name "*.so" -o -name "*.dylib" \) -exec cp {} collected/ \;
        ls -lh collected/

    - name: Upload collected libraries
      uses: actions/upload-artifact@v5
      with:
        name: webp4j-all-platforms
        path: collected/
        retention-days: 7

    - name: Create checksum
      run: |
        cd collected
        sha256sum * > SHA256SUMS
        cat SHA256SUMS

    - name: Upload checksum
      uses: actions/upload-artifact@v5
      with:
        name: webp4j-checksums
        path: collected/SHA256SUMS
        retention-days: 7