name: Build Native Libraries

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'src/main/c/**'
      - 'CMakeLists.txt'
      - 'libwebp/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/main/c/**'
      - 'CMakeLists.txt'
      - 'libwebp/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '17'

jobs:
  # ============================================
  # Windows Build (using MinGW)
  # ============================================
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Setup MinGW
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-make

    - name: Build
      shell: msys2 {0}
      run: |
        mkdir build && cd build
        cmake -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release ..
        mingw32-make -j$(nproc)
        mingw32-make install

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: webp4j-windows-${{ matrix.arch }}
        path: src/main/resources/native/webp4j-windows-${{ matrix.arch }}.dll
        retention-days: 7

  # ============================================
  # macOS Build
  # ============================================
  build-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-13      # Intel Mac (x64)
            arch: x64
          - os: macos-14      # Apple Silicon (arm64)
            arch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Install CMake
      run: brew install cmake

    - name: Build
      run: |
        mkdir build && cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        make -j$(sysctl -n hw.ncpu)
        make install

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: webp4j-mac-${{ matrix.arch }}
        path: src/main/resources/native/libwebp4j-mac-${{ matrix.arch }}.dylib
        retention-days: 7

  # ============================================
  # Linux Build (x86_64)
  # ============================================
  build-linux-x64:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Build
      run: |
        mkdir build && cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)
        make install

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: webp4j-linux-x64
        path: src/main/resources/native/libwebp4j-linux-x64.so
        retention-days: 7

  # ============================================
  # Linux ARM64 Build (native build using QEMU)
  # ============================================
  build-linux-arm64:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Build on ARM64
      uses: uraimo/run-on-arch-action@v2
      with:
        arch: aarch64
        distro: ubuntu22.04
        githubToken: ${{ github.token }}

        install: |
          apt-get update -q -y
          apt-get install -q -y build-essential cmake openjdk-17-jdk git

        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-arm64
          export PATH="${JAVA_HOME}/bin:${PATH}"
          export WEBP4J_QEMU_BUILD=1
          git config --global --add safe.directory /home/runner/work/webp4j/webp4j
          git config --global --add safe.directory /home/runner/work/webp4j/webp4j/libwebp
          git submodule update --init --recursive
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          make install

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: webp4j-linux-aarch64
        path: src/main/resources/native/libwebp4j-linux-aarch64.so
        retention-days: 7

  # ============================================
  # Linux ARM32 Build (native build using QEMU)
  # ============================================
  build-linux-arm32:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm

    - name: Build on ARM32
      uses: uraimo/run-on-arch-action@v2
      with:
        arch: armv7
        distro: ubuntu22.04
        githubToken: ${{ github.token }}

        install: |
          apt-get update -q -y
          apt-get install -q -y build-essential cmake openjdk-17-jdk git

        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-armhf
          export PATH="${JAVA_HOME}/bin:${PATH}"
          export WEBP4J_QEMU_BUILD=1
          git config --global --add safe.directory /home/runner/work/webp4j/webp4j
          git config --global --add safe.directory /home/runner/work/webp4j/webp4j/libwebp
          git submodule update --init --recursive
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          make install

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: webp4j-linux-arm
        path: src/main/resources/native/libwebp4j-linux-arm.so
        retention-days: 7

  # ============================================
  # Collect libraries from all platforms
  # ============================================
  collect-artifacts:
    needs: [build-windows, build-macos, build-linux-x64, build-linux-arm64, build-linux-arm32]
    runs-on: ubuntu-latest

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: native-libraries

    - name: Display structure of downloaded files
      run: ls -R native-libraries

    - name: Organize files
      run: |
        mkdir -p collected
        find native-libraries -type f \( -name "*.dll" -o -name "*.so" -o -name "*.dylib" \) -exec cp {} collected/ \;
        ls -lh collected/

    - name: Upload collected libraries
      uses: actions/upload-artifact@v4
      with:
        name: webp4j-all-platforms
        path: collected/
        retention-days: 30

    - name: Create checksum
      run: |
        cd collected
        sha256sum * > SHA256SUMS
        cat SHA256SUMS

    - name: Upload checksum
      uses: actions/upload-artifact@v4
      with:
        name: webp4j-checksums
        path: collected/SHA256SUMS
        retention-days: 30

  # ============================================
  # Publish to Maven Central
  # ============================================
  publish-maven:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux-x64, build-linux-arm64, build-linux-arm32]
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java for Maven Central
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        cache: 'maven'
        server-id: 'ossrh'
        server-username: OSSRH_USERNAME
        server-password: OSSRH_PASSWORD
        gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
        gpg-passphrase: GPG_PASSPHRASE

    - name: Download all native artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: webp4j-*
        merge-multiple: true
        path: downloads

    - name: Prepare native resources directory
      run: |
        mkdir -p src/main/resources/native
        shopt -s nullglob
        mv downloads/*.so src/main/resources/native/ 2>/dev/null || true
        mv downloads/*.dylib src/main/resources/native/ 2>/dev/null || true
        mv downloads/*.dll src/main/resources/native/ 2>/dev/null || true
        echo "Native files:" && ls -lh src/main/resources/native || true

    - name: Build and package JAR
      run: |
        mvn -B clean package -DskipTests
        echo "JAR contents:" && jar tf target/webp4j-*.jar | grep native/ || true

    - name: Publish to Maven Central
      env:
        OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        mvn -B deploy -DskipTests

  # ============================================
  # Create GitHub Release (only when tag is pushed)
  # ============================================
  create-release:
    needs: collect-artifacts
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download collected artifacts
      uses: actions/download-artifact@v4
      with:
        name: webp4j-all-platforms
        path: release-files

    - name: Download checksums
      uses: actions/download-artifact@v4
      with:
        name: webp4j-checksums
        path: release-files

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release-files/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
